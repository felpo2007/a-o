[project]
name = "quantbr"
version = "0.0.1"
description = "Estratégias de trade IBOV + S&P 500 com validação fora da amostra e modelo dedicado para GOOGL"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "jinja2>=3.1.6",
    "numpy>=2.4.6",
    "pandas>=3.1.1",
    "pandas-market-calendars>=5.6.0",
    "pyarrow>=26.0.1",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "scipy>=1.17.1",
    "vectorbt>=1.2.0",
    "yfinance>=1.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantbr"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "network: testes que acessam a internet (rodam só com RUN_NETWORK_TESTS=1)",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
