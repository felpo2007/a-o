[project]
name = "vantuong65-tools"
version = "0.1.0"
description = "Ferramentas de pesquisa e pipeline de terreno do VAN TUONG '65 (Roblox)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pyproj>=3.6",
    "rasterio>=1.3",
    "pillow>=10",
    "scipy>=1.11",
    "scikit-image>=0.26.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]
# redução local de malha (tools/decimate_glb.py); precisa de libopengl0 no sistema
arte = ["pymeshlab==2025.7.post1"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
